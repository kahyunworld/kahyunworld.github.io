<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <title>Sablemoor — placeholder city map</title>
  <!--
    PLACEHOLDER ARTWORK. Meant to be replaced.

    This is the detail map shown once the camera has zoomed into Sablemoor. It is
    drawn at its own scale rather than being a magnified crop of the world map,
    which is what keeps the zoomed view sharp. Replace it by editing the
    `art` field on the sablemoor location in content/world.ts.
  -->
  <defs>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e9d5" />
      <stop offset="100%" stop-color="#ded0b2" />
    </linearGradient>
    <pattern id="tide" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 13 q 10 -7 20 0 t 20 0" fill="none" stroke="#7d979c" stroke-width="1.3" opacity="0.55" />
    </pattern>
    <g id="block">
      <rect x="-26" y="-18" width="52" height="36" fill="#e0d0b0" stroke="#6b5a41" stroke-width="2" />
    </g>
    <g id="lamp">
      <circle r="5" fill="#b4762a" />
      <circle r="11" fill="none" stroke="#b4762a" stroke-width="1.5" opacity="0.5" />
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#fog)" />

  <!-- The harbour, at the bottom of the plan -->
  <path d="M0 740 C 200 700 360 780 540 760 C 720 740 860 800 1040 776 C 1220 752 1420 800 1600 770 L1600 1000 L0 1000 Z"
        fill="#9fb7bb" />
  <path d="M0 740 C 200 700 360 780 540 760 C 720 740 860 800 1040 776 C 1220 752 1420 800 1600 770 L1600 1000 L0 1000 Z"
        fill="url(#tide)" />

  <!-- Canals -->
  <g fill="none" stroke="#9fb7bb" stroke-width="18" stroke-linecap="round">
    <path d="M420 120 C 440 300 380 480 430 736" />
    <path d="M1080 100 C 1050 300 1120 520 1070 772" />
    <path d="M300 430 C 560 400 900 460 1240 420" />
  </g>

  <!-- Street grid -->
  <g stroke="#6b5a41" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <path d="M140 210 H1460" />
    <path d="M120 320 H1480" />
    <path d="M160 540 H1440" />
    <path d="M200 650 H1400" />
    <path d="M620 110 V700" />
    <path d="M800 90 V720" />
    <path d="M960 110 V700" />
  </g>

